authors = [
    { name = "Lynix Dancho", email = "laredjyacine955@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "openai>=3.6.0",
